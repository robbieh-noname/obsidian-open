<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Open in Obsidian</title>
<style>body{font:16px system-ui,sans-serif;margin:3rem;color:#222}</style>
</head>
<body>
<p id="msg">Nothing to open: add a note path after <code>#</code>.</p>
<p><button id="back" hidden>&larr; Back</button></p>
<p id="log" style="color:#888;font-size:12px"></p>
<script>
// Usage: https://robbieh-noname.github.io/obsidian-open/#<vault-relative note path, URL-encoded>
// The part after "#" never leaves the browser. Only obsidian://open in the "Work" vault is ever opened.
// After Obsidian takes focus, return to the page the link was clicked on (or close the tab if it was opened in a new one).
(function () {
  var raw = location.hash.slice(1);
  if (!raw) return;
  var file;
  try { file = decodeURIComponent(raw); } catch (e) { file = raw; }
  var target = "obsidian://open?vault=Work&file=" + encodeURIComponent(file);
  var msg = document.getElementById("msg");
  msg.textContent = "Opening in Obsidian: " + file + " ";
  var a = document.createElement("a");
  a.href = target;
  a.textContent = "(click here if nothing happens)";
  msg.appendChild(a);

  // Return once Obsidian has taken focus. Chrome doesn't reliably fire "blur" for an
  // external-app handoff, so also poll document.hasFocus(). Gives up after 15 s (e.g. the
  // "Open Obsidian?" prompt was dismissed), leaving the Back button.
  var log = document.getElementById("log");
  function note(t) { log.textContent += (log.textContent ? " · " : "") + t; }
  var done = false;
  function goBack(why) {
    if (done) return;
    done = true;
    note("back (" + why + ", history " + history.length + ")");
    if (history.length > 1) { history.back(); } else { window.close(); }
  }
  var back = document.getElementById("back");
  back.hidden = false;
  back.onclick = function () { done = false; goBack("button"); };
  window.addEventListener("blur", function () { note("blur"); setTimeout(function () { goBack("blur"); }, 300); }, { once: true });
  document.addEventListener("visibilitychange", function () {
    note("visibility " + document.visibilityState);
    if (document.visibilityState === "hidden") setTimeout(function () { goBack("hidden"); }, 300);
  });
  var started = Date.now();
  var poll = setInterval(function () {
    if (done || Date.now() - started > 15000) { clearInterval(poll); return; }
    if (!document.hasFocus()) { clearInterval(poll); setTimeout(function () { goBack("focus-poll"); }, 300); }
  }, 200);

  location.href = target;
})();
</script>
</body>
</html>
